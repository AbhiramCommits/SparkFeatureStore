# Configuration for Spark on Kubernetes (production-style).
#
# Local kind proof: S3A points at in-cluster MinIO; Postgres at the
# in-cluster StatefulSet. AWS: remove s3a.access_key/secret_key (pod
# identity via IRSA), set the S3 endpoint to empty, and size the executors
# for EKS nodes (see docs/deploy-aws.md).
environment: k8s

paths:
  raw: "s3a://datalake/raw"
  bronze: "s3a://datalake/bronze"
  silver: "s3a://datalake/silver"
  models: "s3a://datalake/models"

spark:
  app_name: sparkfeaturestore
  default_profile: k8s
  shuffle_partitions: 64
  log_level: WARN
  profiles:
    local:
      master: "local[*]"
      driver_memory: 2g
      executor_memory: 2g
    cluster:
      master: "spark://spark-master:7077"
      driver_memory: 2g
      executor_memory: 2g
      executor_cores: 2
    k8s:
      master: "k8s://https://kubernetes.default.svc:443"
      driver_memory: 1g
      executor_memory: 1g
      executor_cores: 2
  extra:
    spark.kubernetes.namespace: "spark-jobs"
    spark.kubernetes.authenticate.driver.serviceAccountName: "spark"
    spark.kubernetes.container.image: "sparkfeaturestore/spark:3.5.9"
    spark.kubernetes.container.image.pullPolicy: "IfNotPresent"
    spark.kubernetes.executor.request.cores: "2"
    spark.kubernetes.driver.request.cores: "1"

s3a:
  enabled: true
  endpoint: "http://minio.spark-jobs.svc.cluster.local:9000"
  access_key: minioadmin
  secret_key: minioadmin
  path_style_access: true
  ssl_enabled: false

postgres:
  host: postgres.spark-jobs.svc.cluster.local
  port: 5432
  database: feature_store
  user: sparkfs
  password: sparkfs
