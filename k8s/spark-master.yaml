# Standalone Spark master for dev/test Kubernetes clusters.
# Production jobs should use spark-submit --master k8s://... (conf/k8s.yaml)
# with the sparkfeaturestore/spark:3.5.9 image instead of these manifests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: spark-jobs
  labels:
    app: spark-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
        - name: spark-master
          image: sparkfeaturestore/spark:3.5.9
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.master.Master
            - -h
            - spark-master
            - --port
            - "7077"
            - --webui-port
            - "8080"
          ports:
            - containerPort: 7077
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: spark-jobs
spec:
  selector:
    app: spark-master
  ports:
    - name: cluster
      port: 7077
      targetPort: 7077
    - name: webui
      port: 8080
      targetPort: 8080
