# TEMPLATE ONLY -- never commit real credentials.
#
# Local kind proof: `make k8s-up` substitutes the dev values and applies
# this. Production (AWS): S3 access comes from IRSA (no secret needed);
# only the Postgres password should come from a real secret manager
# (SealedSecrets / ExternalSecrets / AWS Secrets Manager).
apiVersion: v1
kind: Secret
metadata:
  name: sparkfeaturestore-secrets
  namespace: spark-jobs
type: Opaque
stringData:
  MINIO_ROOT_USER: "CHANGEME_MINIO_USER"
  MINIO_ROOT_PASSWORD: "CHANGEME_MINIO_PASSWORD"
  POSTGRES_PASSWORD: "CHANGEME_POSTGRES_PASSWORD"
