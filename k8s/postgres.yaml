# Postgres 16 as a StatefulSet with a PVC (feature metadata registry).
# Production alternative: AWS RDS -- then delete this manifest, point
# conf/k8s.yaml postgres.host at the RDS endpoint and load the password
# from a secret (see docs/deploy-aws.md).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: spark-jobs
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-nodeport
  namespace: spark-jobs
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: spark-jobs
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          env:
            - name: POSTGRES_USER
              value: sparkfs
            - name: POSTGRES_DB
              value: feature_store
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sparkfeaturestore-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sparkfs", "-d", "feature_store"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: spark-jobs
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
