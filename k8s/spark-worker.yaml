# Standalone Spark workers (dev/test only; see spark-master.yaml notes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: spark-jobs
  labels:
    app: spark-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      containers:
        - name: spark-worker
          image: sparkfeaturestore/spark:3.5.9
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - spark://spark-master:7077
            - --cores
            - "2"
            - --memory
            - "2G"
          ports:
            - containerPort: 8081
