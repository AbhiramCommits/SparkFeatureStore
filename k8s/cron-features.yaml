# Daily feature refresh (silver build) as a CronJob.
# Stale completed driver pods are cleaned up by the Spark k8s client on
# resubmission; concurrencyPolicy=Forbid prevents overlapping runs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spark-features-daily
  namespace: spark-jobs
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: spark
          restartPolicy: Never
          containers:
            - name: spark-submit
              image: sparkfeaturestore/spark:3.5.9
              imagePullPolicy: IfNotPresent
              command: ["/opt/spark/bin/spark-submit"]
              args:
                - --master
                - k8s://https://kubernetes.default.svc:443
                - --deploy-mode
                - cluster
                - --name
                - silver-features-daily
                - --conf
                - spark.kubernetes.namespace=spark-jobs
                - --conf
                - spark.kubernetes.authenticate.driver.serviceAccountName=spark
                - --conf
                - spark.kubernetes.container.image=sparkfeaturestore/spark:3.5.9
                - --conf
                - spark.kubernetes.container.image.pullPolicy=IfNotPresent
                - --conf
                - spark.kubernetes.driver.label.job=silver-features-daily
                - --conf
                - spark.kubernetes.driver.label.pipeline=sparkfeaturestore
                - --conf
                - spark.driver.memory=1g
                - --conf
                - spark.executor.memory=1g
                - --conf
                - spark.executor.instances=2
                - --conf
                - spark.executor.cores=2
                - /opt/sparkfeaturestore/features/build_silver.py
                - --env
                - k8s
                - --profile
                - k8s
              volumeMounts:
                - name: conf
                  mountPath: /opt/sparkfeaturestore/conf/k8s.yaml
                  subPath: k8s.yaml
          volumes:
            - name: conf
              configMap:
                name: sparkfeaturestore-conf
