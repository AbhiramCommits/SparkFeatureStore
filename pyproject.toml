[project]
name = "sparkfeaturestore"
version = "0.1.0"
description = "Distributed feature pipeline and ML training platform on Apache Spark"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "joblib==1.4.2",
    "numpy==2.2.1",
    "pandas==2.2.3",
    "psycopg[binary]==3.2.3",
    "pyarrow==18.1.0",
    "pyspark==3.5.9",
    "pyyaml==6.0.2",
    "requests==2.32.3",
    "scikit-learn==1.6.1",
    "torch==2.5.1",
]

[dependency-groups]
dev = [
    "black==25.1.0",
    "mypy==1.14.1",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.9.6",
    "types-pyyaml==6.0.12.20241230",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-m", "not integration"]
markers = [
    "integration: end-to-end pipeline tests (require the docker-compose stack)",
]

[tool.mypy]
python_version = "3.11"
files = [
    "common/config.py",
    "common/logging.py",
    "common/retry.py",
    "features/registry.py",
    "quality/registry.py",
    "training/artifacts.py",
    "training/data.py",
]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
