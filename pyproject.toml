[project]
name = "sparkfeaturestore"
version = "0.1.0"
description = "Distributed feature pipeline and ML training platform on Apache Spark"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "psycopg[binary]==3.2.3",
    "pyarrow==18.1.0",
    "pyspark==3.5.9",
    "pyyaml==6.0.2",
    "requests==2.32.3",
]

[dependency-groups]
dev = [
    "black==25.1.0",
    "pytest==8.3.4",
    "ruff==0.9.6",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
